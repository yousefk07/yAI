<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #12141a;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #e8eaf0;
  }

  .calculator {
    width: 320px;
    padding: 20px;
    background: #1b1e27;
    border: 1px solid #2b3040;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
  }

  .display {
    width: 100%;
    padding: 16px 14px;
    margin-bottom: 16px;
    background: #0f1116;
    border: 1px solid #2b3040;
    border-radius: 12px;
    color: #f5f7ff;
    font-size: 2rem;
    font-family: inherit;
    text-align: right;
    letter-spacing: 0.5px;
  }

  .display:focus { outline: none; }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    padding: 16px 0;
    border: none;
    border-radius: 12px;
    background: #262b38;
    color: #e8eaf0;
    font-size: 1.15rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:hover { background: #313848; }
  button:active { transform: scale(0.96); }

  .operator { background: #2f3a52; color: #9fc4ff; }
  .operator:hover { background: #3a4763; }

  .equals { background: #3b6fd4; color: #ffffff; }
  .equals:hover { background: #4a7fe4; }

  .clear { background: #4a2b33; color: #ff9aa8; }
  .clear:hover { background: #5c3540; }

  .span-two { grid-column: span 2; }
</style>
</head>
<body>
  <div class="calculator">
    <input class="display" id="display" type="text" value="0" readonly aria-label="Calculator display">
    <div class="keys">
      <button class="clear" data-action="clear">C</button>
      <button class="operator" data-op="÷">÷</button>
      <button class="operator" data-op="×">×</button>
      <button class="operator" data-op="-">−</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-op="+">+</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-op="+">+</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-op="-">−</button>

      <button data-digit="0" class="span-two">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ---- Core operations (re-implemented inline, no calculator.js import) ----
  function add(a, b) { return a + b; }
  function subtract(a, b) { return a - b; }
  function multiply(a, b) { return a * b; }
  function divide(a, b) {
    if (b === 0) throw new Error('Division by zero');
    return a / b;
  }

  function compute(op, a, b) {
    switch (op) {
      case '+': return add(a, b);
      case '-': return subtract(a, b);
      case '×': return multiply(a, b);
      case '÷': return divide(a, b);
      default: throw new Error('Unknown operator: ' + op);
    }
  }

  // ---- State machine ----
  var currentValue = '0';   // string being typed
  var previousValue = null; // number
  var operator = null;      // '+', '-', '×', '÷'
  var overwrite = true;     // next digit starts a new number

  var display = document.getElementById('display');

  function render(text) {
    display.value = text;
  }

  // Display-only: rounds to 10 decimal places to hide floating point noise,
  // so long results (e.g. 1/3) are shown truncated rather than exactly.
  function format(n) {
    if (!isFinite(n)) return 'Error';
    var rounded = Math.round(n * 1e10) / 1e10;
    return String(rounded);
  }

  function inputDigit(d) {
    if (overwrite) {
      currentValue = d;
      overwrite = false;
    } else {
      currentValue = currentValue === '0' ? d : currentValue + d;
    }
    render(currentValue);
  }

  function inputDecimal() {
    if (overwrite) {
      currentValue = '0.';
      overwrite = false;
    } else if (currentValue.indexOf('.') === -1) {
      currentValue += '.';
    }
    render(currentValue);
  }

  function chooseOperator(op) {
    var value = parseFloat(currentValue);
    if (operator !== null && !overwrite) {
      var result;
      try {
        result = compute(operator, previousValue, value);
      } catch (err) {
        reset();
        render('Error');
        return;
      }
      if (!isFinite(result)) {
        reset();
        render('Error');
        return;
      }
      previousValue = result;
      currentValue = format(result);
      render(currentValue);
    } else {
      previousValue = value;
    }
    operator = op;
    overwrite = true;
  }

  function equals() {
    if (operator === null) return;
    var value = parseFloat(currentValue);
    var result;
    try {
      result = compute(operator, previousValue, value);
    } catch (err) {
      reset();
      render('Error');
      return;
    }
    if (!isFinite(result)) {
      reset();
      render('Error');
      return;
    }
    currentValue = format(result);
    previousValue = null;
    operator = null;
    overwrite = true;
    render(currentValue);
  }

  function reset() {
    currentValue = '0';
    previousValue = null;
    operator = null;
    overwrite = true;
  }

  function clear() {
    reset();
    render('0');
  }

  // ---- Wiring ----
  document.querySelectorAll('button[data-digit]').forEach(function (btn) {
    btn.addEventListener('click', function () { inputDigit(btn.dataset.digit); });
  });

  document.querySelectorAll('button[data-op]').forEach(function (btn) {
    btn.addEventListener('click', function () { chooseOperator(btn.dataset.op); });
  });

  document.querySelectorAll('button[data-action]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var action = btn.dataset.action;
      if (action === 'clear') clear();
      else if (action === 'decimal') inputDecimal();
      else if (action === 'equals') equals();
    });
  });

  // Keyboard support
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k >= '0' && k <= '9') inputDigit(k);
    else if (k === '.') inputDecimal();
    else if (k === '+' || k === '-' || k === '*' || k === '/') {
      chooseOperator(k === '*' ? '×' : k === '/' ? '÷' : k);
    } else if (k === 'Enter' || k === '=') equals();
    else if (k === 'Escape' || k === 'c' || k === 'C') clear();
  });

  clear();
})();
</script>
</body>
</html>
