<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f8f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
  <title>Your usage · yAI</title>
  <meta name="description" content="What you've used on yAI today and over the last 30 days, against your daily limits." />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Your usage (2026-10-20 redesign): today against the daily limits, the last 30 days, all time; admins also see
       everyone. Counters come from /api/hub?op=usage. A limit at 80% or more turns purple. */
    .stage { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 48px 40px; }
    .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    .head h1 { margin: 0 0 6px; font-size: 30px; font-weight: 600; letter-spacing: -0.03em; }
    .head p { margin: 0; font-size: 14px; color: var(--text-2); }
    .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
    .tile, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
    .tile { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .tile-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-2); gap: 8px; }
    .tile-top span:last-child { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .tile.warn .tile-top span:last-child { color: var(--acc-ink); font-weight: 600; }
    .tile-val { display: flex; align-items: baseline; gap: 6px; }
    .tile-val b { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
    .tile-val span { font-size: 13px; color: var(--muted); }
    .meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
    .meter i { display: block; height: 100%; border-radius: 3px; background: var(--text); }
    .tile.warn .meter i { background: var(--acc); }
    .row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
    .panel { padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
    .panel-label { font-size: 13px; color: var(--text-2); }
    .chart-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .chart-top b { display: block; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 4px; }
    .chart-top small { font-size: 12.5px; color: var(--muted); }
    .bars { height: 180px; display: flex; align-items: flex-end; gap: 6px; border-bottom: 1px solid var(--border); }
    .bars div { flex: 1; min-height: 2px; background: var(--border-strong); border-radius: 3px 3px 0 0; cursor: default; }
    .bars div:last-child { background: var(--acc); }
    .bars div:hover { background: var(--text-2); }
    .bars div:last-child:hover { filter: brightness(1.1); background: var(--acc); }
    .axis { display: flex; justify-content: space-between; font: 400 11.5px var(--mono); color: var(--muted); margin-top: -8px; }
    .axis span:last-child { color: var(--acc-ink); }
    .tip { position: absolute; pointer-events: none; padding: 6px 9px; border-radius: 8px; background: var(--ink); color: var(--on-ink); font-size: 12.5px; white-space: nowrap; transform: translate(-50%, -100%); z-index: 2; }
    .model-row { display: flex; flex-direction: column; gap: 7px; }
    .model-row div:first-child { display: flex; justify-content: space-between; font-size: 14px; gap: 8px; }
    .model-row b { font-weight: 500; }
    .model-row span { font-variant-numeric: tabular-nums; color: var(--text-2); }
    .model-row .meter i { background: var(--text-2); }
    .totals { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 24px; }
    .totals b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .totals small { font-size: 12.5px; color: var(--muted); }
    .empty { color: var(--muted); font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    th.num, td.num { text-align: right; }
    .scroll { overflow-x: auto; }
    details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    .page-title { font-weight: 600; font-size: 15px; display: none; }
    @media (max-width: 900px) {
      .stage { padding: 4px 16px 24px; }
      .wrap { gap: 14px; }
      .tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
      .tiles .tile:first-child { grid-column: 1 / -1; }
      .tile { padding: 14px; }
      .tile-val b { font-size: 24px; }
      .row { grid-template-columns: 1fr; }
      .bars { height: 110px; gap: 4px; }
      .totals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .head h1 { display: none; }
      .head p { font-size: 13px; }
      .page-title { display: block; }
    }
    @media (max-width: 600px) { .topbar { display: grid; } .page-title { grid-column: 2; justify-self: center; } }
  </style>
</head>
<body data-page="usage">
  <div class="shell" id="shell">
    <div class="app">
      <header class="topbar">
        <div class="brand-wrap">
          <button class="icon-btn side-toggle" id="sideToggle" type="button" aria-label="Show chats" hidden>
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h10"/></svg>
          </button>
          <span class="page-title">Your usage</span>
        </div>
        <div class="topbar-right"><a class="avatar page-avatar" href="/" title="Back to chat" style="text-decoration:none"></a></div>
      </header>
      <main class="stage">
        <div class="wrap">
          <div class="head"><h1>Your usage</h1><p id="lede">Loading</p></div>
          <div class="tiles" id="tiles"></div>
          <div class="row">
            <div class="panel" id="chartPanel">
              <div class="chart-top"><div><span class="panel-label">Messages · last 30 days</span><b id="monthTotal">0</b></div><small id="avg"></small></div>
              <div class="bars" id="bars" role="img" aria-label="Messages per day over the last 30 days"></div>
              <div class="axis" id="axis"></div>
              <div class="tip" id="tip" hidden></div>
              <details><summary>Show as a table</summary><div class="scroll"><table id="dayTable"></table></div></details>
            </div>
            <div class="panel"><span class="panel-label">Models used · 30 days</span><div id="models" style="display:flex;flex-direction:column;gap:16px"></div></div>
          </div>
          <div class="panel"><span class="panel-label">All time · since you joined (counting started 20 October 2026)</span><div class="totals" id="totals"></div></div>
          <div class="panel" id="everyone" hidden><span class="panel-label">Everyone (admins only) · today and the last 30 days, busiest first</span><div class="scroll"><table id="everyoneTable"></table></div></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/side.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const num = (n) => (n || 0).toLocaleString();
    const short = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(1)} M` : n >= 1e4 ? `${Math.round(n / 1e3)}k` : (n || 0).toLocaleString());
    const usd = (micros) => `$${((micros || 0) / 1e6).toFixed(2)}`;
    const msgs = (d) => (d.messages || 0) + (d.codeMessages || 0);
    const day = (iso, opts) => new Date(iso + "T12:00:00Z").toLocaleDateString(undefined, opts);

    function untilReset(iso) {
      const m = Math.max(0, Math.round((new Date(iso) - Date.now()) / 60000));
      return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
    }
    // A tile: the value, "of <limit>", a note (left, %, no limit) and a meter that turns purple at 80%.
    function tile(label, used, limit, fmt, note) {
      const share = limit ? Math.min(1, used / limit) : 0;
      const left = limit ? limit - used : null;
      return `<div class="tile${share >= 0.8 ? " warn" : ""}">
        <div class="tile-top"><span>${esc(label)}</span><span>${esc(note ?? (limit ? (left > 0 ? `${fmt(left)} left` : "Limit reached") : "No limit"))}</span></div>
        <div class="tile-val"><b>${fmt(used)}</b>${limit ? `<span>of ${fmt(limit)}</span>` : ""}</div>
        <div class="meter" role="meter" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${limit || 0}" aria-valuenow="${used}"><i style="width:${(share * 100).toFixed(1)}%"></i></div>
      </div>`;
    }

    function drawBars(days) {
      const max = Math.max(4, ...days.map(msgs));
      $("bars").innerHTML = days.map((d, i) => `<div data-i="${i}" style="height:${Math.max(1.2, (msgs(d) / max) * 100)}%"></div>`).join("");
      $("axis").innerHTML = `<span>${day(days[0].day, { day: "numeric", month: "short" })}</span><span>${day(days[15].day, { day: "numeric", month: "short" })}</span><span>Today</span>`;
      const tip = $("tip"), panel = $("chartPanel");
      $("bars").onpointermove = (e) => {
        const bar = e.target.closest("[data-i]");
        if (!bar) return (tip.hidden = true);
        const d = days[+bar.dataset.i];
        tip.innerHTML = `<b>${day(d.day, { weekday: "short", month: "short", day: "numeric" })}</b> · ${num(msgs(d))} message${msgs(d) === 1 ? "" : "s"}` +
          (d.codeMessages ? ` (${num(d.codeMessages)} in yAI Code)` : "") + (d.images ? ` · ${d.images} image${d.images === 1 ? "" : "s"}` : "");
        const b = bar.getBoundingClientRect(), p = panel.getBoundingClientRect();
        tip.style.left = `${b.left - p.left + b.width / 2}px`;
        tip.style.top = `${b.top - p.top - 6}px`;
        tip.hidden = false;
      };
      $("bars").onpointerleave = () => (tip.hidden = true);
      $("dayTable").innerHTML = `<thead><tr><th>Day</th><th class="num">Website</th><th class="num">yAI Code</th><th class="num">Images</th><th class="num">Videos</th><th class="num">Searches</th><th class="num">yAI Ultra</th></tr></thead><tbody>` +
        days.slice().reverse().map((d) => `<tr><td>${d.day}</td><td class="num">${num(d.messages)}</td><td class="num">${num(d.codeMessages)}</td><td class="num">${num(d.images)}</td><td class="num">${num(d.videos)}</td><td class="num">${num(d.searches)}</td><td class="num">${usd(d.ultraMicros)}</td></tr>`).join("") + "</tbody>";
    }

    function render(data) {
      const t = data.today, todayRow = data.days[data.days.length - 1] || {};
      $("lede").textContent = `${new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })} · daily limits reset at midnight UTC, in ${untilReset(t.resetsAt)}${t.admin ? " · admins have no image or video limit" : ""}`;
      const pct = t.ultra.limitUsd ? Math.round((t.ultra.spentUsd / t.ultra.limitUsd) * 100) : 0;
      $("tiles").innerHTML = [
        tile("Messages today", msgs(todayRow), null, num, todayRow.codeMessages ? `${num(todayRow.codeMessages)} in yAI Code` : "No limit"),
        tile("yAI Ultra", Math.round(t.ultra.spentUsd * 1e6), Math.round(t.ultra.limitUsd * 1e6), usd, `${pct}%`),
        tile("Images", t.images.used, t.images.limit, num),
        tile("Videos", t.videos.used, t.videos.limit, num),
        tile("Web searches", t.searches.used, t.searches.limit, num),
      ].join("");
      const month = data.days.reduce((n, d) => n + msgs(d), 0);
      $("monthTotal").textContent = num(month);
      $("avg").textContent = `avg ${num(Math.round(month / data.days.length))} / day`;
      drawBars(data.days);

      const perModel = {};
      for (const d of data.days) for (const [k, v] of Object.entries(d)) if (k.startsWith("m:")) perModel[k.slice(2)] = (perModel[k.slice(2)] || 0) + v;
      const list = Object.entries(perModel).sort((a, b) => b[1] - a[1]);
      const top = list[0]?.[1] || 1;
      $("models").innerHTML = list.length
        ? list.map(([m, n]) => `<div class="model-row"><div><b>${esc(m)}</b><span>${num(n)}</span></div><div class="meter"><i style="width:${(n / top) * 100}%"></i></div></div>`).join("")
        : '<p class="empty">Nothing in the last 30 days yet.</p>';
      const x = data.total;
      $("totals").innerHTML = [[num(msgs(x)), "Messages"], [short((x.tokensIn || 0) + (x.tokensOut || 0)), "Tokens"], [num(x.images), "Images"], [num(x.videos), "Videos"], [num(x.searches), "Searches"], [usd(x.ultraMicros), "On yAI Ultra"]]
        .map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`).join("");
    }

    async function loadEveryone() {
      const r = await fetch("/api/hub?op=usage-all", { cache: "no-store" });
      if (!r.ok) return;
      const { users } = await r.json();
      $("everyone").hidden = false;
      $("everyoneTable").innerHTML = `<thead><tr><th>Account</th><th class="num">Today</th><th class="num">30 days</th><th class="num">yAI Code</th><th class="num">Images today</th><th class="num">Videos today</th><th class="num">Searches</th><th class="num">Ultra today</th><th class="num">Ultra 30 d</th></tr></thead><tbody>` +
        users.map((u) => `<tr><td>${esc(u.username)}</td><td class="num">${num(msgs(u.todayCounts || {}))}</td><td class="num">${num(msgs(u.last30))}</td><td class="num">${num(u.last30.codeMessages)}</td>
          <td class="num">${u.today.images.used}${u.today.images.limit ? `/${u.today.images.limit}` : ""}</td><td class="num">${u.today.videos.used}${u.today.videos.limit ? `/${u.today.videos.limit}` : ""}</td>
          <td class="num">${num(u.last30.searches)}</td><td class="num">$${u.today.ultra.spentUsd.toFixed(2)}</td><td class="num">${usd(u.last30.ultraMicros)}</td></tr>`).join("") + "</tbody>";
    }

    (async () => {
      const r = await fetch("/api/hub?op=usage", { cache: "no-store" });
      if (r.status === 401) { location.href = "/"; return; }
      const data = await r.json();
      if (!r.ok) { $("lede").textContent = data.error || "Couldn't load your usage."; return; }
      render(data);
      if (data.today.admin) loadEveryone();
    })().catch(() => ($("lede").textContent = "Couldn't load your usage. Try again in a moment."));
  </script>
</body>
</html>
