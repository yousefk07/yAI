<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f8f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
  <title>Remote · yAI</title>
  <meta name="description" content="Send tasks to yAI Code on your computer from your phone, and watch it work." />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Remote (2026-10-21 redesign): the phone side of `yai remote` (lib/remote.js), drawn like a yAI chat. A list of
       sessions (each run of yai remote; the live one first), and a session's chat: your tasks as messages, yAI's
       words, its steps and edits, its questions as buttons, and a box to send the next task to the live session. */
    .stage { flex: 1; min-height: 0; display: flex; }
    .r-list { width: 300px; flex: none; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .r-list-head { padding: 18px 18px 10px; }
    .r-list-head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
    .r-list-head p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
    .r-sessions { flex: 1; overflow-y: auto; padding: 4px 10px 18px; }
    .r-label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); padding: 14px 8px 6px; }
    .r-sess { width: 100%; display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 0; border-radius: 12px; background: none; color: var(--text); text-align: left; cursor: pointer; }
    .r-sess:hover { background: var(--hover); }
    .r-sess[aria-current="true"] { background: var(--acc-soft); }
    .r-sess .dot { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--faint); flex: none; }
    .r-sess .dot.on { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
    .r-sess > span { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .r-sess b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-sess small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-sess .live-tag { color: var(--ok); font-weight: 600; }
    .r-empty { color: var(--muted); font-size: 13.5px; line-height: 1.55; padding: 8px; margin: 0; }
    code.inline { font-family: var(--mono); font-size: 0.9em; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }

    .r-chat { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
    .r-chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--border); min-height: 56px; }
    .r-chat-head .back { display: none; }
    .r-chat-head .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .r-chat-head b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-chat-head small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
    .r-pill.live { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); font-weight: 600; }
    .r-thread { flex: 1; overflow-y: auto; padding: 22px 20px 30px; }
    .r-inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    .r-task, .r-body { display: flex; flex-direction: column; gap: 12px; }
    .r-user { align-self: flex-end; max-width: 85%; background: var(--surface-2); padding: 10px 14px; border-radius: 18px 18px 6px 18px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .r-user small { display: block; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
    .r-text { font-size: 15px; line-height: 1.6; }
    .r-text .content > :first-child { margin-top: 0; }
    .r-text .content > :last-child { margin-bottom: 0; }
    .r-steps { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .r-step { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; color: var(--muted); min-width: 0; }
    .r-step .verb { flex: none; font: 500 12px var(--mono); color: var(--text); }
    .r-step .arg { min-width: 0; font-family: var(--mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-step .res { flex: none; margin-left: auto; font-size: 12.5px; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-step .res.error { color: var(--bad); }
    .r-step .res.warn { color: #c98a14; }
    .r-step.pending .res::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; border: 2px solid var(--border-strong); border-top-color: var(--acc); border-radius: 50%; animation: spin 0.8s linear infinite; }
    .r-diff { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
    .r-diff summary { list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: center; padding: 9px 12px; font-size: 13.5px; }
    .r-diff summary::-webkit-details-marker { display: none; }
    .r-diff summary b { font-family: var(--mono); font-size: 12.5px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .r-diff .add { color: var(--ok); font: 500 12px var(--mono); }
    .r-diff .del { color: var(--bad); font: 500 12px var(--mono); }
    .r-diff pre { margin: 0; max-height: 360px; overflow: auto; font: 12px/1.55 var(--mono); border-top: 1px solid var(--border); }
    .r-diff pre div { padding: 0 12px; white-space: pre; }
    .r-diff pre .p { background: color-mix(in srgb, var(--ok) 14%, transparent); }
    .r-diff pre .m { background: color-mix(in srgb, var(--bad) 14%, transparent); }
    .r-diff pre .g { color: var(--muted); }
    .r-note { font-size: 13px; color: var(--muted); }
    .r-out { margin: 0; padding: 12px 14px; border-radius: 12px; background: #151514; color: #e8e7e2; font: 12px/1.55 var(--mono); white-space: pre-wrap; max-height: 360px; overflow: auto; }
    .r-ask { padding: 14px; border-radius: 14px; border: 1px solid var(--acc); background: var(--acc-soft); display: flex; flex-direction: column; gap: 10px; }
    .r-ask b { font-weight: 600; }
    .r-ask pre { margin: 0; max-height: 240px; overflow: auto; padding: 10px; border-radius: 8px; background: var(--surface); font: 12px/1.5 var(--mono); white-space: pre-wrap; }
    .r-ask .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .r-ask .row button { height: 36px; width: auto; padding: 0 14px; }
    .r-err { color: var(--bad); font-size: 14px; }
    .r-status { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
    .r-status:empty { display: none; }
    .r-status.working::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--border-strong); border-top-color: var(--acc); border-radius: 50%; animation: spin 0.8s linear infinite; }

    .r-compose { padding: 10px 20px calc(14px + env(safe-area-inset-bottom)); }
    .r-compose .box { max-width: 780px; margin: 0 auto; border: 1px solid var(--border-strong); border-radius: 20px; background: var(--surface); padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
    .r-compose textarea { width: 100%; border: 0; outline: none; resize: none; background: none; color: var(--text); font: 15px/1.5 var(--sans); min-height: 24px; max-height: 180px; }
    .r-compose .bar { display: flex; align-items: center; gap: 8px; }
    .r-compose select { height: 32px; border: 1px solid var(--border); border-radius: 999px; padding: 0 10px; background: var(--surface); color: var(--text); font-size: 13px; max-width: 60%; }
    .r-compose .send { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); display: grid; place-items: center; cursor: pointer; }
    .r-compose .send:disabled { opacity: 0.35; cursor: default; }
    .r-compose .stop { height: 32px; width: auto; padding: 0 12px; }
    .r-compose .hint { max-width: 780px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }
    .r-blank { flex: 1; display: grid; place-items: center; color: var(--muted); font-size: 14px; padding: 24px; text-align: center; }

    @media (max-width: 760px) {
      .r-list { width: 100%; border-right: 0; }
      .r-chat { display: none; }
      .stage.open .r-list { display: none; }
      .stage.open .r-chat { display: flex; }
      .r-chat-head { padding: 10px 12px; }
      .r-chat-head .back { display: inline-grid; }
      .r-thread { padding: 16px 14px 24px; }
      .r-compose { padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body data-page="remote">
  <div class="shell" id="shell">
    <div class="app">
      <header class="topbar">
        <div class="brand-wrap">
          <button class="icon-btn side-toggle" id="sideToggle" type="button" aria-label="Show chats" hidden>
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h10"/></svg>
          </button>
          <span class="page-title">Remote</span>
        </div>
        <div class="topbar-right"><a class="avatar page-avatar" href="/" title="Back to chat" style="text-decoration:none"></a></div>
      </header>
      <main class="stage" id="stage">
        <aside class="r-list">
          <div class="r-list-head"><h1>Remote</h1><p>yAI Code on your PC, from anywhere. Run <code class="inline">yai remote</code> in a project on your PC to start a live session.</p></div>
          <div class="r-sessions" id="sessions"><p class="r-empty">Loading…</p></div>
        </aside>
        <section class="r-chat" id="chat">
          <div class="r-blank">Pick a session to see what yAI did, or start one with <code class="inline">yai remote</code> on your PC.</div>
        </section>
      </main>
    </div>
  </div>

  <script src="/md.js"></script>
  <script src="/side.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const ago = (ms) => { const s = (Date.now() - ms) / 1000; return s < 60 ? "just now" : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
    const md = (t) => (window.renderMarkdown ? renderMarkdown(t) : `<p>${esc(t)}</p>`);
    const MODES = { default: "Ask me before changes", acceptEdits: "Edit without asking", background: "On a new branch, then push", plan: "Plan only" };
    let sessions = [], current = null, follow = null, running = null;

    async function hub(op, opts = {}) {
      const r = await fetch(`/api/hub?op=${op}`, { cache: "no-store", ...opts, headers: { "Content-Type": "application/json" } });
      if (r.status === 401) { location.href = "/"; throw new Error("Log in"); }
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || `Error ${r.status}`);
      return d;
    }

    // ---------- the list of sessions ----------
    const titleOf = (s) => (s.tasks[0]?.text || "New session").split("\n")[0];
    function renderList() {
      const live = sessions.filter((s) => s.live), past = sessions.filter((s) => !s.live);
      const row = (s) => `<button type="button" class="r-sess" data-s="${esc(s.id)}" aria-current="${current?.id === s.id}">
          <i class="dot${s.live ? " on" : ""}"></i><span><b>${esc(s.live && !s.tasks.length ? `${s.name} is listening` : titleOf(s))}</b>
          <small>${s.live ? '<span class="live-tag">Live</span> · ' : ""}${esc(s.name)} · ${esc((s.folder || "").split(/[\\/]/).pop())}${s.tasks.length ? ` · ${s.tasks.length} task${s.tasks.length === 1 ? "" : "s"}` : ""} · ${ago(s.tasks.at(-1)?.ts || s.startedAt)}</small></span></button>`;
      $("sessions").innerHTML = !sessions.length
        ? '<p class="r-empty">No sessions yet. On your PC, open a terminal in a project and run <code class="inline">yai remote</code> (or type <code class="inline">/remote</code> in yAI Code). It shows up here as a live session within a few seconds.</p>'
        : (live.length ? `<div class="r-label">Live</div>${live.map(row).join("")}` : "") + (past.length ? `<div class="r-label">Past sessions</div>${past.map(row).join("")}` : "");
    }
    async function loadSessions() {
      try { sessions = (await hub("remote-sessions")).sessions; } catch { return; }
      renderList();
      if (!current) return;
      const fresh = sessions.find((s) => s.id === current.id);
      if (!fresh) return;
      const added = fresh.tasks.filter((t) => !current.tasks.some((x) => x.id === t.id));
      const changed = current.live !== fresh.live;
      current.live = fresh.live;
      for (const t of added) { current.tasks.push(t); appendTask(t); }
      if (changed) renderHead();
    }
    $("sessions").addEventListener("click", (e) => {
      const b = e.target.closest(".r-sess");
      if (b) openSession(b.dataset.s);
    });

    // ---------- one session, as a chat ----------
    function renderHead() {
      const pill = $("chat").querySelector(".r-pill");
      if (!pill) return;
      pill.className = `r-pill${current.live ? " live" : ""}`;
      pill.textContent = current.live ? "Live" : "Ended";
      $("compose").hidden = !current.live;
      $("ended").hidden = current.live;
    }
    function openSession(id, { push = true } = {}) {
      const s = sessions.find((x) => x.id === id);
      if (!s) return;
      follow?.abort();
      running = null;
      current = { ...s, tasks: [...s.tasks] };
      $("stage").classList.add("open");
      if (push) history.pushState({ s: id }, "", `#${id}`);
      $("chat").innerHTML = `
        <div class="r-chat-head">
          <button type="button" class="icon-btn back" id="back" aria-label="Back to sessions"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div class="t"><b>${esc(s.name)}</b><small title="${esc(s.folder || "")}">${esc((s.folder || "").split(/[\\/]/).pop())}${s.model ? ` · ${esc(s.model)}` : ""}</small></div>
          <span class="r-pill"></span>
        </div>
        <div class="r-thread" id="thread"><div class="r-inner" id="inner"></div></div>
        <div class="r-compose" id="compose">
          <div class="box">
            <textarea id="taskInput" rows="1" placeholder="Send yAI a task on ${esc(s.name)}…"></textarea>
            <div class="bar">
              <select id="mode" aria-label="Approvals">${Object.entries(MODES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
              <button type="button" class="btn-ghost stop" id="stop" hidden>Stop</button>
              <button type="button" class="send" id="send" aria-label="Send" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
            </div>
          </div>
          <div class="hint">Tasks run in this session on your PC one after another, and remember what came before.</div>
        </div>
        <div class="r-compose" id="ended" hidden><div class="hint">This session ended. Run <code class="inline">yai remote</code> on the PC to start a new one.</div></div>`;
      renderHead();
      renderList();
      $("back").addEventListener("click", () => (history.state?.s ? history.back() : closeSession()));
      const ta = $("taskInput");
      ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(180, ta.scrollHeight) + "px"; $("send").disabled = !ta.value.trim(); });
      ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && innerWidth > 760) { e.preventDefault(); send(); } });
      $("send").addEventListener("click", send);
      $("stop").addEventListener("click", stopRunning);
      try { $("mode").value = localStorage.getItem("remoteMode") || "default"; } catch {}
      $("mode").addEventListener("change", () => { try { localStorage.setItem("remoteMode", $("mode").value); } catch {} });
      if (!current.tasks.length) $("inner").innerHTML = `<div class="r-note">${s.live ? `${esc(s.name)} is listening in ${esc(s.folder || "this folder")}. Send it a task below.` : "No tasks in this session."}</div>`;
      (async () => { for (const t of current.tasks) await appendTask(t, { replay: true }); toBottom(); })();
    }
    function closeSession() {
      follow?.abort();
      current = null;
      $("stage").classList.remove("open");
      $("chat").innerHTML = '<div class="r-blank">Pick a session to see what yAI did.</div>';
      renderList();
    }
    addEventListener("popstate", () => { if (history.state?.s) openSession(history.state.s, { push: false }); else closeSession(); });

    async function send() {
      const text = $("taskInput").value.trim();
      if (!text || !current) return;
      $("send").disabled = true;
      try {
        const { task } = await hub("remote-task", { method: "POST", body: JSON.stringify({ m: current.m, text, mode: $("mode").value }) });
        $("taskInput").value = "";
        $("taskInput").style.height = "auto";
        if (!current.tasks.length) $("inner").innerHTML = "";
        current.tasks.push(task);
        appendTask(task);
      } catch (err) {
        $("inner").insertAdjacentHTML("beforeend", `<div class="r-err">${esc(err.message)}</div>`);
        $("send").disabled = false;
      }
    }
    async function stopRunning() {
      if (!running) return;
      $("stop").textContent = "Stopping…";
      await hub("remote-stop", { method: "POST", body: JSON.stringify({ m: running.m, task: running.id }) }).catch(() => {});
    }

    // One task in the thread: your message, then what yAI said and did, live while it runs.
    const nearBottom = () => { const th = $("thread"); return !th || th.scrollHeight - th.scrollTop - th.clientHeight < 90; };
    const toBottom = () => { const th = $("thread"); if (th) th.scrollTop = th.scrollHeight; };
    async function appendTask(task, { replay = false } = {}) {
      const inner = $("inner");
      if (!inner) return;
      const box = document.createElement("div");
      box.className = "r-task";
      box.innerHTML = `<div class="r-user">${esc(task.text)}<small>${esc(MODES[task.mode] || "")} · ${ago(task.ts)}</small></div><div class="r-body"></div><div class="r-status"></div>`;
      inner.appendChild(box);
      const body = box.querySelector(".r-body"), status = box.querySelector(".r-status");
      let text = null, textBuf = [], steps = null, lastStep = null;
      const answered = new Set();
      const add = (html) => { body.insertAdjacentHTML("beforeend", html); return body.lastElementChild; };
      const render = (ev, live) => {
        if (ev.t === "out") { text = steps = null; return add(`<pre class="r-out">${esc(ev.text)}</pre>`); }
        if (ev.t === "error") return add(`<div class="r-err">✕ ${esc(ev.text)}</div>`);
        if (ev.t === "answered") { answered.add(ev.id); return body.querySelector(`[data-ask="${CSS.escape(ev.id)}"]`)?.remove(); }
        if (ev.t === "ask") { if (!answered.has(ev.id)) showAsk(ev, task, body, answered, live); return; }
        if (ev.t !== "ev" || !ev.ev) return;
        const e = ev.ev;
        if (e.type === "text-start") { text = add('<div class="r-text"><div class="content"></div></div>'); textBuf = []; steps = null; }
        else if (e.type === "text") {
          if (!text) { text = add('<div class="r-text"><div class="content"></div></div>'); textBuf = []; steps = null; }
          textBuf.push(e.line);
          text.querySelector(".content").innerHTML = md(textBuf.join("\n"));
        } else if (e.type === "step") {
          if (!steps) { steps = add('<div class="r-steps"></div>'); text = null; }
          steps.insertAdjacentHTML("beforeend", `<div class="r-step pending"><span class="verb">${esc(e.verb)}</span><span class="arg">${esc(e.arg)}</span><span class="res"></span></div>`);
          lastStep = steps.lastElementChild;
        } else if (e.type === "step-result" && lastStep) {
          const res = lastStep.querySelector(".res");
          res.textContent = e.summary || String(e.text || "").split("\n").find((l) => l.trim()) || "done";
          if (e.tone) res.classList.add(e.tone);
          lastStep.classList.remove("pending");
          lastStep.title = e.text || "";
        } else if (e.type === "step-cancel" && lastStep) { lastStep.remove(); lastStep = null; }
        else if (e.type === "diff") {
          text = null; steps = null;
          const lines = (e.lines || []).map(([k, n, t]) => `<div class="${k === "+" ? "p" : k === "-" ? "m" : k === "…" ? "g" : ""}">${esc(String(n || "").padStart(4))} ${esc(k)} ${esc(t)}</div>`).join("");
          add(`<details class="r-diff"><summary><span>${e.created ? "Created" : "Edited"}</span><b>${esc(e.path)}</b><span class="add">+${e.added}</span><span class="del">−${e.removed}</span></summary><pre>${lines}</pre></details>`);
        } else if (e.type === "note" && String(e.text || "").trim() && !/^(answered on the phone|from your phone)/i.test(String(e.text).trim())) { text = null; add(`<div class="r-note">${esc(e.text)}</div>`); }
      };
      const setStatus = (s) => {
        status.className = `r-status${s === "running" ? " working" : ""}`;
        status.textContent = { queued: "Waiting for the PC to pick it up…", running: "Working…", stopped: "Stopped.", error: "It didn't finish." }[s] || "";
        if (s === "running" || s === "queued") running = task;
        else if (running?.id === task.id) running = null;
        if ($("stop")) { $("stop").hidden = !running; $("stop").textContent = "Stop"; }
      };
      setStatus(task.status);
      if (!replay) toBottom();
      // the task's events: all at once when it's finished, then live (long polls) while it runs
      const ctl = new AbortController();
      if (task.status === "running" || task.status === "queued") { follow?.abort(); follow = ctl; }
      let from = 0, first = true;
      while (!ctl.signal.aborted && $("inner") === inner) {
        let d;
        try {
          const r = await fetch(`/api/hub?op=remote-feed&task=${encodeURIComponent(task.id)}&from=${from}`, { cache: "no-store", signal: ctl.signal });
          d = await r.json();
          if (!r.ok) throw new Error(d.error);
        } catch (err) {
          if (ctl.signal.aborted || $("inner") !== inner) return;
          if (/not found/i.test(String(err.message))) { status.className = "r-status"; status.textContent = "Its output has expired."; return; }
          await new Promise((r) => setTimeout(r, 3000));
          continue;
        }
        const keep = nearBottom();
        const live = !(replay && first);
        for (const ev of d.events) render(ev, live);
        from = d.next;
        first = false;
        setStatus(d.status);
        if (keep && live) toBottom();
        if (["done", "stopped", "error"].includes(d.status)) break;
      }
    }
    function showAsk(ev, task, body, answered, live) {
      body.insertAdjacentHTML("beforeend", `<div class="r-ask" data-ask="${esc(ev.id)}"><b>${esc(ev.title)}</b>${ev.detail ? `<pre>${esc(ev.detail)}</pre>` : ""}
        <div class="row">${ev.options.map((o, i) => `<button type="button" class="${i === 0 ? "btn-primary" : "btn-ghost"}" data-choice="${i}">${esc(o)}</button>`).join("")}</div></div>`);
      const card = body.lastElementChild;
      card.addEventListener("click", async (e) => {
        const b = e.target.closest("[data-choice]"); if (!b) return;
        answered.add(ev.id);
        card.outerHTML = `<div class="r-note">You chose: ${esc(b.textContent)}</div>`;
        await hub("remote-answer", { method: "POST", body: JSON.stringify({ m: task.m, task: task.id, ask: ev.id, choice: Number(b.dataset.choice) }) }).catch(() => {});
      });
      if (live) { toBottom(); if (navigator.vibrate) navigator.vibrate(120); }
    }

    loadSessions().then(() => {
      const id = location.hash.slice(1);
      if (id && sessions.some((s) => s.id === id)) openSession(id, { push: false });
      else if (innerWidth > 760) { const pick = sessions.find((s) => s.live) || sessions[0]; if (pick) openSession(pick.id, { push: false }); }
    });
    setInterval(() => { if (!document.hidden) loadSessions(); }, 8000);
  </script>
</body>
</html>
