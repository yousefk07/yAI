<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found · yAI</title>
  <script>
    // A GitHub sign-in that came back to an address that doesn't exist (the GitHub app's callback URL has a different
    // path): pass it on to yAI's real callback, so the connection still works (2026-10-21).
    (function () {
      var p = new URLSearchParams(location.search);
      if (p.get("code") && p.get("state")) { p.delete("op"); location.replace("/api/hub?op=github-callback&" + p.toString()); }
    })();
  </script>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; background: #f8f8f6; color: #1b1b1a; }
    @media (prefers-color-scheme: dark) { body { background: #141413; color: #ecebe7; } a { color: #b9a6ff; } }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 14px; opacity: .7; }
    a { color: #6d4fd8; }
  </style>
</head>
<body>
  <main>
    <h1>This page doesn't exist</h1>
    <p>It may have moved, or the link has a typo.</p>
    <a href="/">Back to yAI</a>
  </main>
</body>
</html>
