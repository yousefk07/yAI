<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f8f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
  <title>What's new · yAI</title>
  <meta name="description" content="What changed in yAI and yAI Code, newest first." />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* What's new (2026-10-20): the releases in /changelog.json, newest first. The version is the build number, the
       count of changes pushed to yAI so far (yAI Code shows the same number). */
    .btn-primary { width: auto; padding: 0 16px; }
    .stage { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 48px 56px; }
    .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
    .head h1 { margin: 0 0 6px; font-size: 30px; font-weight: 600; letter-spacing: -0.03em; }
    .head p { margin: 0; font-size: 14px; color: var(--text-2); }
    .rel { display: grid; grid-template-columns: 150px 1fr; gap: 24px; }
    .rel-side { position: sticky; top: 0; align-self: start; display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
    .rel-side b { font: 600 14px var(--mono); }
    .rel-side small { color: var(--muted); font-size: 12.5px; }
    .rel-side .new { align-self: flex-start; margin-top: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--acc-soft); color: var(--acc-ink); }
    .rel-main h2 { margin: 0 0 14px; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
    .item { display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-top: 1px solid var(--border); }
    .item:first-of-type { border-top: 0; padding-top: 0; }
    .item div { display: flex; gap: 10px; align-items: baseline; }
    .item b { font-weight: 600; font-size: 15px; }
    .item span { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .item p { margin: 0; color: var(--text-2); font-size: 14.5px; line-height: 1.6; }
    .page-title { font-weight: 600; font-size: 15px; display: none; }
    @media (max-width: 900px) {
      .stage { padding: 4px 16px 32px; }
      .head h1 { display: none; } .page-title { display: block; }
      .rel { grid-template-columns: 1fr; gap: 8px; }
      .rel-side { position: static; flex-direction: row; align-items: center; gap: 10px; }
      .rel-side .new { margin: 0; }
    }
    @media (max-width: 600px) { .topbar { display: grid; } .page-title { grid-column: 2; justify-self: center; } }
  </style>
</head>
<body data-page="changelog">
  <div class="shell" id="shell">
    <div class="app">
      <header class="topbar">
        <div class="brand-wrap">
          <button class="icon-btn side-toggle" id="sideToggle" type="button" aria-label="Show chats" hidden>
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h10"/></svg>
          </button>
          <span class="page-title">What's new</span>
        </div>
        <div class="topbar-right"><a class="avatar page-avatar" href="/" title="Back to chat" style="text-decoration:none"></a></div>
      </header>
      <main class="stage">
        <div class="wrap">
          <div class="head"><h1>What's new</h1><p>Changes to yAI and yAI Code, newest first. Version numbers count every update pushed so far.</p></div>
          <div id="list" style="display:flex;flex-direction:column;gap:40px"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="/side.js"></script>
  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    fetch("/changelog.json", { cache: "no-cache" }).then((r) => r.json()).then(({ releases }) => {
      try { localStorage.setItem("seenRelease", JSON.stringify(releases[0].version)); } catch {}
      document.getElementById("list").innerHTML = releases.map((r, i) => `<article class="rel">
        <div class="rel-side"><b>${esc(r.version)}</b><small>${new Date(r.date + "T12:00:00").toLocaleDateString([], { month: "long", day: "numeric", year: "numeric" })}</small>${i === 0 ? '<span class="new">Latest</span>' : ""}</div>
        <div class="rel-main"><h2>${esc(r.title)}</h2>${r.items.map((x) => `<div class="item"><div><b>${esc(x.title)}</b><span>${esc(x.area)}</span></div><p>${esc(x.text)}</p></div>`).join("")}</div></article>`).join("");
    });
  </script>
</body>
</html>
